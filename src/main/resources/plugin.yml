name: MiniCashwerewolf
version: '1.0-SNAPSHOT'
main: MiniCash.miniCashwerewolf.MiniCashWereWolf
api-version: '1.21'

commands:
  mwgame:
    usage: /mwgame <引数>
    desctiption: "人狼ゲームコマンド"
    default: op
    aliases:
      - MiniCashwerewolfgame

    permission: minicashwerewolf.commands


permissions:
  minicashwerewolf.*:
    description: MiniCashwerewolfプラグインのすべてのアクションとコマンドの使用を許可します
    default: false
    children:
      minicashwerewolf.commands.help: true
      minicashwerewolf.commands.start: true
      minicashwerewolf.commands.position: true
      minicashwerewolf.commands.player: true
      minicashwerewolf.commands.give: true
      minicashwerewolf.commands.stop: true
      minicashwerewolf.commands.villagerspawn: true

  minicashwerewolf.commands:
    default: false
    children:
      minicashwerewolf.commands.help: true
      minicashwerewolf.commands.start: true
      minicashwerewolf.commands.position: true
      minicashwerewolf.commands.player: true
      minicashwerewolf.commands.give: true
      minicashwerewolf.commands.stop: true
      minicashwerewolf.commands.villagerspawn: true